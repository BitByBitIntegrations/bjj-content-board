# Keeps the free-tier Supabase project from pausing.
# Supabase pauses free projects after ~7 days with no database activity —
# that's what emptied the board in Nov 2026. This runs a tiny read query once a day.
#
# It also re-enables itself each run, because GitHub turns off scheduled
# workflows in repos with no commits for 60 days.
#
# If it fails, GitHub emails you — that means the project is paused/down:
# restore it at https://supabase.com/dashboard/project/abusswpafdzmiznrlcdz
name: supabase-keepalive

on:
  schedule:
    - cron: "17 13 * * *"   # daily, ~8:17am ET
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: read
  actions: write             # only to reset the 60-day timer below

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        # Uses the public anon key already in index.html — no secrets needed.
        run: |
          URL=$(grep -oE "SUPABASE_URL *= *'[^']+'" index.html | head -1 | sed -E "s/.*'([^']+)'/\1/")
          KEY=$(grep -oE "SUPABASE_ANON *= *'[^']+'" index.html | head -1 | sed -E "s/.*'([^']+)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::Couldn't find SUPABASE_URL / SUPABASE_ANON in index.html"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "$URL/rest/v1/cards?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || code=000
            if [ "$code" = "200" ]; then echo "Supabase is awake (HTTP 200)"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 20
          done
          echo "::error::Supabase didn't answer — it's probably paused. Restore it: https://supabase.com/dashboard/project/abusswpafdzmiznrlcdz"
          exit 1

      - name: Reset GitHub's 60-day inactivity timer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
